<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><meta name="description" content="문단을 확장하고 연결하는 HCI 4조 프로토타입"><style>body{margin:0;padding:12px;background:light-dark(#ebeef3,#14151a);color-scheme:light dark}#writing-map-demo{width:100%;max-width:1600px;margin:auto}@media(max-width:500px){body{padding:0}#writing-map-demo{border-radius:0}}</style></head><body>
<div id="writing-map-demo" lang="ko">
  <style>
    #writing-map-demo{color-scheme:light dark;--wm-bg:light-dark(#f8f7f3,#191c1a);--wm-paper:light-dark(#fffefa,#242824);--wm-ink:light-dark(#28392f,#e6ece3);--wm-dim:light-dark(#667167,#acb7aa);--wm-line:light-dark(#dedfd6,#444d43);--wm-soft:light-dark(#ecefe7,#30382f);--wm-green:light-dark(#345e46,#a4c7a8);--wm-on:light-dark(#fffefa,#1c2b20);--wm-tint:light-dark(#edf3e9,#2c3c2e);--wm-gold:light-dark(#806025,#dec58a);--wm-shadow:light-dark(#24382c17,#00000040);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55;color:var(--wm-ink);position:relative;background:var(--wm-bg);min-height:740px;isolation:isolate;overflow:hidden;border-radius:14px}
    #writing-map-demo *{box-sizing:border-box}
    #writing-map-demo [hidden]{display:none!important}
    #writing-map-demo button,#writing-map-demo input,#writing-map-demo textarea,#writing-map-demo select{font:inherit;color:inherit}
    #writing-map-demo button{cursor:pointer}
    #writing-map-demo button:disabled{opacity:.42;cursor:default}
    #writing-map-demo a{color:var(--wm-green);text-decoration:underline;text-underline-offset:3px}
    #writing-map-demo h1,#writing-map-demo h2,#writing-map-demo h3,#writing-map-demo p{margin:0}
    #writing-map-demo .wm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 13px;background:var(--wm-paper);border:1px solid var(--wm-line);border-radius:9px;white-space:nowrap;font-size:13px;text-decoration:none}
    #writing-map-demo .wm-btn:hover{background:var(--wm-soft)}
    #writing-map-demo .wm-primary{background:var(--wm-green);color:var(--wm-on);border-color:var(--wm-green)}
    #writing-map-demo .wm-primary:hover{filter:brightness(.94);background:var(--wm-green)}
    #writing-map-demo .wm-quiet{background:transparent;border-color:transparent}
    #writing-map-demo .wm-small{font-size:12px;color:var(--wm-dim)}
    #writing-map-demo .wm-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.02em;color:var(--wm-green);background:var(--wm-tint);padding:3px 7px;border-radius:5px;white-space:nowrap}
    #writing-map-demo .wm-home{min-height:632px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 28px 72px;transition:opacity .25s,transform .35s,max-height .35s}
    #writing-map-demo .wm-home.wm-fold{opacity:0;transform:translateY(-22px) scale(.97)}
    #writing-map-demo .wm-kicker{font-size:11px;letter-spacing:.16em;color:var(--wm-green);margin-bottom:18px}
    #writing-map-demo .wm-home h1{font-family:Georgia,"Batang",serif;font-weight:400;font-size:37px;line-height:1.45;letter-spacing:-1.9px;text-align:center}
    #writing-map-demo .wm-home .wm-subtitle{margin-top:17px;text-align:center;color:var(--wm-dim);font-size:14px;line-height:1.8}
    #writing-map-demo .wm-input-box{width:min(610px,100%);margin-top:30px;background:var(--wm-paper);border:1px solid var(--wm-line);border-radius:15px;padding:17px;box-shadow:0 8px 30px var(--wm-shadow)}
    #writing-map-demo .wm-input-box textarea{width:100%;resize:vertical;min-height:95px;max-height:180px;background:transparent;border:0;padding:4px;line-height:1.75;font-size:15px}
    #writing-map-demo textarea::placeholder,#writing-map-demo input::placeholder{color:var(--wm-dim);opacity:1}
    #writing-map-demo .wm-input-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
    #writing-map-demo .wm-kind{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--wm-dim)}
    #writing-map-demo .wm-kind label{display:flex;align-items:center;gap:4px;cursor:pointer}
    #writing-map-demo input[type=radio]{accent-color:var(--wm-green)}
    #writing-map-demo .wm-example{margin-top:17px;text-align:center;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
    #writing-map-demo .wm-example button{font-size:12px;white-space:normal;text-align:left}
    #writing-map-demo .wm-under{margin-top:26px;font-size:11px;color:var(--wm-dim);text-align:center}
    #writing-map-demo .wm-work-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 12px;gap:12px}
    #writing-map-demo .wm-work-head h2{font-size:18px;font-weight:500;letter-spacing:-.6px}
    #writing-map-demo .wm-work-head p{margin-top:3px;font-size:12px;color:var(--wm-dim)}
    #writing-map-demo .wm-work-actions{display:flex;gap:6px;align-items:center}
    #writing-map-demo .wm-guide{margin:0 24px 13px;border-left:2px solid var(--wm-green);padding:2px 0 2px 11px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--wm-dim)}
    #writing-map-demo .wm-guide strong{color:var(--wm-ink);font-weight:500}
    #writing-map-demo .wm-layout{display:flex;position:relative;min-height:554px;border-top:1px solid var(--wm-line)}
    #writing-map-demo .wm-map-wrap{flex:1;min-width:0;position:relative}
    #writing-map-demo .wm-map{height:554px;position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--wm-line) .7px,transparent .7px);background-size:21px 21px;cursor:grab}
    #writing-map-demo .wm-map.wm-dragging{cursor:grabbing}
    #writing-map-demo .wm-world{position:absolute;left:0;top:0;transform-origin:0 0}
    #writing-map-demo .wm-links{position:absolute;inset:0;overflow:visible;pointer-events:none}
    #writing-map-demo .wm-link{fill:none;stroke:var(--wm-line);stroke-width:1.7;transition:d .25s}
    #writing-map-demo .wm-link.wm-link-active{stroke:var(--wm-green);stroke-width:2}
    #writing-map-demo .wm-node{position:absolute;width:180px;height:180px;background:var(--wm-paper);border:1.5px solid var(--wm-line);border-radius:50%;box-shadow:0 4px 16px var(--wm-shadow);transition:left .38s cubic-bezier(.2,.8,.2,1),top .38s cubic-bezier(.2,.8,.2,1),width .28s,height .28s,box-shadow .2s,border-color .2s;cursor:default}
    #writing-map-demo .wm-node.wm-sub{width:148px;height:148px;background:var(--wm-tint)}
    #writing-map-demo .wm-node.wm-selected{border-color:var(--wm-green);box-shadow:0 0 0 4px var(--wm-tint),0 4px 16px var(--wm-shadow)}
    #writing-map-demo .wm-node.wm-pinned{border:2px solid var(--wm-green)}
    #writing-map-demo .wm-sub.wm-pinned{background:var(--wm-paper);box-shadow:0 0 0 5px var(--wm-tint),0 8px 25px var(--wm-shadow)}
    #writing-map-demo .wm-node.wm-shrunk{box-shadow:none;background:var(--wm-soft);border-color:var(--wm-line)}
    #writing-map-demo .wm-shrunk .wm-node-main{padding:9px}
    #writing-map-demo .wm-node.wm-shrunk .wm-node-title{font-size:11px;line-height:1.4;-webkit-line-clamp:2;color:var(--wm-dim)}
    #writing-map-demo .wm-node-mini-index{font-size:11px;color:var(--wm-green);margin-bottom:2px}
    #writing-map-demo .wm-link-muted{opacity:.45}
    #writing-map-demo .wm-pin-group{margin:14px 0 6px}
    #writing-map-demo .wm-pin-group h3{font-size:11px;font-weight:500;color:var(--wm-dim);margin-bottom:7px}
    #writing-map-demo .wm-pin-group .wm-pin-item{padding:9px 0 9px calc(var(--wm-depth,0)*8px)}
    #writing-map-demo .wm-pin-title .wm-unpin{font-size:13px;padding:1px 3px;margin-left:auto;flex-shrink:0}
    #writing-map-demo .wm-node.wm-new{animation:wm-sprout .4s ease both}
    #writing-map-demo .wm-node-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;border:0;border-radius:50%;background:transparent;padding:0}
    #writing-map-demo .wm-node-textbox{display:flex;flex-direction:column;align-items:stretch;justify-content:center;width:72%;height:68%;min-width:0;min-height:0;overflow:hidden;text-align:left;background:transparent;border:0;border-radius:0;box-shadow:none}
    #writing-map-demo .wm-node-textbox .wm-node-title{width:100%;text-align:left;word-break:keep-all;overflow-wrap:anywhere;flex:0 0 auto;min-height:0}
    #writing-map-demo .wm-node-textbox .wm-node-meta{flex-shrink:0;white-space:nowrap}
    #writing-map-demo .wm-node-textbox .wm-node-origin{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
    #writing-map-demo .wm-node.wm-shrunk .wm-node-main{padding:0}
    #writing-map-demo .wm-shrunk .wm-node-textbox{text-align:center}
    #writing-map-demo .wm-shrunk .wm-node-textbox .wm-node-title{text-align:center}
    #writing-map-demo .wm-node-mini-index{text-align:center;flex-shrink:0;line-height:1.2}
    #writing-map-demo .wm-node-meta{display:flex;gap:5px;align-items:center;justify-content:center;margin-bottom:8px;font-size:11px;color:var(--wm-dim);flex-wrap:wrap}
    #writing-map-demo .wm-node-dot{width:6px;height:6px;background:var(--wm-green);border-radius:50%}
    #writing-map-demo .wm-node-title{font-size:14px;line-height:1.65;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
    #writing-map-demo .wm-sub .wm-node-title{font-size:12px;-webkit-line-clamp:2}
    #writing-map-demo .wm-sub.wm-pinned .wm-node-title{-webkit-line-clamp:3}
    #writing-map-demo .wm-node-origin{font-size:10px;color:var(--wm-dim);margin-top:7px}
    #writing-map-demo .wm-node-pin{position:absolute;right:11px;top:11px;font-size:17px;color:var(--wm-green)}
    #writing-map-demo .wm-develop-link{fill:none;stroke:var(--wm-green);stroke-width:2;opacity:.7}
    #writing-map-demo .wm-link-label{fill:var(--wm-dim);font-size:11px}
    #writing-map-demo .wm-menu-backdrop{position:absolute;inset:0 0 auto;height:554px;border:0;border-radius:0;background:light-dark(#11221770,#00000090);z-index:7;cursor:default}
    #writing-map-demo .wm-orbit-layer{position:absolute;left:0;top:0;width:100%;height:554px;z-index:8;pointer-events:none}
    #writing-map-demo .wm-orbit{position:absolute;inset:0;pointer-events:none}
    #writing-map-demo .wm-orbit-node{position:absolute;border-radius:50%;background:var(--wm-paper);border:2px solid var(--wm-green);box-shadow:0 0 0 7px light-dark(#ffffff18,#dbe4d112);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0;pointer-events:auto;cursor:pointer;color:var(--wm-ink)}
    #writing-map-demo .wm-orbit-node.wm-sub{background:var(--wm-tint)}
    #writing-map-demo .wm-orbit-node .wm-node-textbox .wm-node-title{font-size:13px;line-height:1.55;-webkit-line-clamp:2}
    #writing-map-demo .wm-fan-sector{position:absolute;background:var(--wm-paper);color:var(--wm-ink);border:0;padding:0;border-radius:0;pointer-events:auto;font-size:12px}
    #writing-map-demo .wm-fan-sector:hover,#writing-map-demo .wm-fan-sector:focus-visible{background:var(--wm-tint);color:var(--wm-green)}
    #writing-map-demo .wm-fan-sector[aria-pressed=true]{background:var(--wm-green);color:var(--wm-on)}
    #writing-map-demo .wm-fan-sector>span{position:absolute;transform:translate(-50%,-50%);width:62px;text-align:center;white-space:normal;pointer-events:none;line-height:1.5}
    #writing-map-demo .wm-fan-pin{font-size:21px}
    #writing-map-demo .wm-home-space{width:min(610px,100%);margin-bottom:12px}

    #writing-map-demo .wm-snap-in{animation:wm-snap .35s cubic-bezier(.2,.8,.2,1)}
    @keyframes wm-snap{0%{transform:scale(1.1)}65%{transform:scale(.96)}100%{transform:scale(1)}}
    #writing-map-demo .wm-map-tools{position:absolute;bottom:16px;left:16px;display:flex;gap:3px;padding:4px;background:var(--wm-paper);border:1px solid var(--wm-line);border-radius:10px;box-shadow:0 3px 12px var(--wm-shadow);align-items:center}

    #writing-map-demo .wm-zoom{font-size:11px;min-width:36px;text-align:center;color:var(--wm-dim)}

    #writing-map-demo .wm-side{width:254px;flex-shrink:0;border-left:1px solid var(--wm-line);padding:18px 16px;background:var(--wm-paper);display:flex;flex-direction:column;max-height:554px}

    #writing-map-demo .wm-side-heading span{font-size:11px;color:var(--wm-dim)}

    #writing-map-demo .wm-pin-controls{display:flex;gap:4px;margin:7px 0 0 23px;align-items:center}

    #writing-map-demo .wm-side-footer{padding-top:15px;border-top:1px solid var(--wm-line);display:grid;gap:8px;margin-top:10px}

    #writing-map-demo .wm-chat-view{min-height:0;display:flex;flex-direction:column;flex:1}

  const clean = (value, limit) => String(value == null ? '' : value).replace(/\s+/g, ' ').trim().slice(0, limit || 180);

  const actionOnly = text => ['이 아이디어를 검토해줘.', '이 아이디어를 평가해줘.', '새로운 아이디어를 제안하고 장점과 한계를 알려줘.', '어떤 근거와 반론을 검토해야 할까?'].includes(clean(text, 150)) || /^(?:(?:이|현재|그)\s*)?(?:(?:아이디어|생각|노드)(?:를|에 대한|의)?\s*)?(?:(?:평가|검토)(?:해\s*줘|해줘|해주세요)?|새(?:로운)?\s*아이디어(?:를)?\s*(?:제안(?:해\s*줘|해줘|해주세요)?|보여\s*줘|보여줘)?)[.!?\s]*$/.test(clean(text, 150));

      q('기록이 이해를 보여준다고 할 수 있을까?', '과정 기록을 잘 썼다는 사실과 학생이 내용을 이해했다는 판단 사이에 어떤 근거가 더 필요한가요?', 'socratic', 'process-validity'),
      q('기록 외에 설명하게 한다면?', '짧은 구두 설명이나 AI 없이 작성하는 후속 과제로 과정 기록을 보완하면 무엇을 확인할 수 있을까요?', 'reframe', 'process-explanation'),
      q('제출 부담은 어디까지 허용할까?', '학습 과정 공개에 드는 시간과 개인정보 부담을 줄이면서 필요한 판단 근거를 남기는 기준은 무엇인가요?', 'ge', 'process-burden'),
      q('결과가 나빠도 과정은 좋을 수 있을까?', '결과물의 품질과 탐색·수정 과정의 질이 다르게 나타날 때 각각 어떤 비중으로 평가할까요?', 'socratic', 'process-weight'),
      q('AI를 쓰지 않은 과정도 보인다면?', '모든 학생이 자신의 주요 선택과 수정 이유를 같은 양식으로 기록하게 하면 무엇이 달라질까요?', 'reframe', 'process-common'),

  function branches(node, ancestors, purpose, batchIndex) {
    node = node || {};
    ancestors = Array.isArray(ancestors) ? ancestors : [];
    const count = node.role === 'sub' ? 2 : 4;
    const requestedBatch = Number(batchIndex == null ? node.branchCount : batchIndex);
    const batch = Number.isFinite(requestedBatch) ? Math.min(Math.floor((Number.MAX_SAFE_INTEGER - count) / count), Math.max(0, Math.floor(requestedBatch))) : 0;
    const ai = isAIDemo(node, ancestors, purpose);
    const fam = family(node);
    const bank = ai ? demoQuestions[fam] || demoQuestions.root : genericMoves.map(m => q(m[0], m[1], m[2], m[3]));
    const start = batch * count;
    const note = contextNote(node, ancestors);
    const result = [];
    for (let k = 0; k < count; k++) {
      const index = start + k;
      if (index < bank.length) {
        const entry = bank[index];
        result.push(Object.assign({}, entry, {
          content: entry.content + '\n\n' + note,
          title: ai ? entry.title : quote(shortTitle(node), 25) + ' · ' + entry.title
        }));
      } else {
        // Authored content never limits navigation. A numbered, editable slot
        // keeps expansion available without pretending to generate an idea.
        result.push({
          title: '세부 생각 ' + (index + 1),
          content: '세부 생각 ' + (index + 1) + ' · 미리 작성된 내용이 없는 임시 노드입니다.\n' +
            '이어지는 생각: ' + quote(nodeText(node), 110) + '.\n' + note +
            '\n글쓰기 목적: ' + rootPurpose(purpose) + '.\n\n내용을 직접 적거나 이 노드에서 대화·검토·확장을 이어갈 수 있습니다. 실제 AI 생성이나 자료 검색은 수행하지 않았습니다.',
          method: null,
          facet: fam,
          placeholder: true
        });
      }
    }
    return result;
  }

    const prepared = preparePrompt('expand', { node, ancestors: ancestors || [], purpose, batchIndex, count });

  function branch(id){closeNodeMenu(false);const n=getNode(id);if(!n)return;const count=n.role==='sub'?2:4,batch=engine.expand(n,ancestors(n),state.purpose,n.branchCount);if(!Array.isArray(batch)||batch.length!==count){toast('질문을 불러오지 못했어요.');return;}batch.forEach(b=>addNode({...b,type:'question',role:'sub',relation:'expand',origin:'ai'},n.id));n.branchCount++;state.activity.branched=true;if(n.role==='sub')state.activity.rebranched=true;state.selectedId=n.id;render();fit();if(chatNodeId)updateChatContext();toast('확장: 서브 노드 '+count+'개를 추가했어요.');}
  function develop(id,direction='after'){
    closeNodeMenu(false);const source=getNode(id);if(!source)return;const main=ownerMain(source),dir=direction==='before'?'before':'after';source.developCount=source.developCount||{before:0,after:0};const candidate=engine.develop(source,ancestors(source),state.purpose,dir,source.developCount[dir]);
    const node=addNode({...candidate,type:'question',role:'main',relation:'develop',origin:'ai',developedFromId:source.id,direction:dir},source.id);const ix=state.mainOrder.indexOf(main.id);state.mainOrder.splice(ix+(dir==='after'?1:0),0,node.id);source.developCount[dir]++;state.activity.developed=true;state.selectedId=node.id;render();fit();if(chatNodeId)updateChatContext();toast('전개: '+(dir==='before'?'앞':'다음')+' 문단에 대응하는 메인 노드 1개를 추가했어요.');
  }
  function togglePin(id){closeNodeMenu(false);const n=getNode(id);if(!n)return;const ix=state.pins.indexOf(id);if(ix<0)state.pins.push(id);else state.pins.splice(ix,1);n.pinned=ix<0;if(state.outline)state.outline.stale=true;render();if(chatNodeId)updateChatContext();if(modal==='outline')renderOutline();toast(ix<0?'📌 글에 활용할 생각으로 채택했어요.':'📌 채택을 해제했어요.');}
  function pinListHTML(){
    sortPins();if(!state.pins.length)return '<div class="wm-pin-empty">마음에 드는 세부 생각에<br>📌를 눌러 모아 보세요.</div>';
    return state.mainOrder.map((mainId,mi)=>{const list=state.pins.filter(id=>ownerMain(getNode(id))?.id===mainId);if(!list.length)return '';return '<section class="wm-pin-group"><h3>문단 '+(mi+1)+'</h3>'+list.map(id=>{const n=getNode(id);let depth=0,p=n;while(p&&p.role==='sub'){depth++;p=getNode(p.parentId);}return '<div class="wm-pin-item '+(state.selectedId===id?'wm-current-pin':'')+'" style="--wm-depth:'+Math.min(depth,3)+'"><div class="wm-pin-title"><span>'+(n.role==='main'?'▭':'↳')+'</span><button type="button" data-action="chat" data-id="'+id+'">'+esc(n.title)+'</button><button type="button" class="wm-unpin" data-action="pin" data-id="'+id+'" aria-label="'+esc(short(n.title,28))+' 채택 해제">📌</button></div></div>';}).join('')+'</section>';}).join('');
  }
  function renderPins(){sortPins();ui('pin-count').textContent=state.pins.length+'개';ui('pin-list').innerHTML=pinListHTML();ui('pin-footnote').textContent=state.pins.length?'지도의 문단·확장 순서로 자동 정렬':'노드 메뉴의 📌로 모아 보세요.';}
  function movePin(id,offset){const ix=state.pins.indexOf(id),to=ix+offset;if(ix<0||to<0||to>=state.pins.length)return;[state.pins[ix],state.pins[to]]=[state.pins[to],state.pins[ix]];if(state.outline)state.outline.stale=true;renderPins();save();if(modal==='outline')renderOutline();toast('📌 목록 순서를 바꿨어요. 개요에는 다시 만들 때 반영됩니다.');}
  function guide(){return {text:'<strong>메인 노드는 문단, 서브 노드는 세부 생각.</strong> 확장으로 세부 생각을, ↑↓ 전개로 앞뒤 문단을 더해요.',label:'선택 노드 메뉴'};}
  function renderGuide(){const g=guide();ui('guide-text').innerHTML=g.text;ui('guide-button').textContent=g.label;}
  function rememberDraft(){if(chatNodeId&&ui('chat-input'))drafts[chatNodeId]=ui('chat-input').value;}
  function syncSidePanel(){
    const chatting=sideTab==='chat'&&Boolean(getNode(chatNodeId));

    root.classList.toggle('wm-chat-open',chatting);
    ui('pins-panel').hidden=chatting;ui('chat-panel').hidden=!chatting;
    ui('side-pins-tab').setAttribute('aria-selected',String(!chatting));
    ui('side-chat-tab').setAttribute('aria-selected',String(chatting));
    ui('side-chat-tab').disabled=!getNode(chatNodeId);
  }
  function showSideTab(tab,focus=false){
    rememberDraft();
    if(tab==='chat'&&!getNode(chatNodeId))return;
    closeNodeMenu(false);sideTab=tab==='chat'?'chat':'pins';syncSidePanel();
    if(state)renderMap();

  function closeChat(restore=true){

  function openModal(name,wide=false){cancelMainDrag();closeNodeMenu(false);rememberDraft();focusBack=document.activeElement;modal=name;ui('overlay').hidden=false;ui('overlay').classList.add('wm-centered');ui('dialog').classList.toggle('wm-wide',wide);root.querySelectorAll('.wm-home,[data-ui="workspace"]').forEach(el=>el.inert=true);}

  function closeModal(restore=true){rememberDraft();modal=null;ui('overlay').hidden=true;ui('dialog').innerHTML='';root.querySelectorAll('[inert]').forEach(el=>el.inert=false);if(restore){const target=focusBack?.isConnected?focusBack:root.querySelector('[data-node="'+state?.selectedId+'"] .wm-node-main')||ui('topic-input');target?.focus({preventScroll:true});}}
  function header(eyebrow,title){return '<div class="wm-dialog-header"><div><p class="wm-small">'+esc(eyebrow)+'</p><h2 id="wm-dialog-title">'+esc(title)+'</h2></div><button type="button" class="wm-close" data-action="close" aria-label="닫고 지도로 돌아가기">×</button></div>';}
  function openChat(id,tab='chat',options={}){
    const n=getNode(id);if(!n)return;
    rememberDraft();cancelMainDrag();closeNodeMenu(false);if(modal)closeModal(false);
    chatNodeId=id;sideTab='chat';chatTab=tab==='evaluation'?'evaluation':'chat';state.selectedId=id;syncSidePanel();render();renderChat();
    requestAnimationFrame(()=>{centerNode(id);(options.focus==='picker'?ui('chat-node-select'):chatTab==='chat'?ui('chat-input'):ui('chat-review-tab'))?.focus({preventScroll:true});});
  }
  function nodeDisplayContent(n){return n.origin==='ai'?String(n.content||n.title).split(/\n\s*\n/)[0]:n.content||n.title;}
  function displayReply(text){return String(text||'').replace(/^예시 응답\s*[·:]\s*(?:새 아이디어 후보|잠정 검토|생각 이어가기)\s*\n+/,'').replace(/^예시 응답\s*[·:]\s*/,'').replace('에 연결한 시연용 대안입니다.','에 연결한 대안입니다.').replace('AI 예시라는 이유로 더 나은 답으로 취급하지 않습니다.','');}
  function renderChatNodePicker(){
    const picker=ui('chat-node-select'),wrapper=ui('chat-node-switcher');if(!picker||!wrapper||!chatNodeId)return;
    const ordered=orderedNodes();wrapper.hidden=ordered.length<2;
    picker.innerHTML=state.mainOrder.map((mainId,mi)=>{
      const main=getNode(mainId);if(!main)return '';
      const options=ordered.filter(n=>n.mainId===mainId).map(n=>{
        const parts=[];let current=n;
        while(current?.role==='sub'){
          const siblings=siblingNodes(current);parts.unshift(siblings.findIndex(s=>s.id===current.id)+1);current=getNode(current.parentId);
        }
        const path=[mi+1,...parts].join('.'),label=(state.pins.includes(n.id)?'📌 ':'')+path+' · '+(n.role==='main'?'메인':'서브')+' · '+n.title;
        return '<option value="'+n.id+'" '+(n.id===chatNodeId?'selected':'')+'>'+esc(label)+'</option>';
      }).join('');
      return '<optgroup label="'+esc('문단 '+(mi+1)+' · '+short(main.title,34))+'">'+options+'</optgroup>';
    }).join('');
    picker.value=chatNodeId;
  }
  function switchChatNode(id){
    if(!chatNodeId||!getNode(id)||id===chatNodeId)return;
    openChat(id,chatTab,{focus:'picker'});
  }

  function renderChatFocus(){
    const n=getNode(chatNodeId),host=ui('chat-focus');if(!n||!host)return;
    const parent=ancestors(n)[0],wasOpen=Boolean(host.querySelector('details')?.open);
    host.innerHTML='<details class="wm-chat-context" '+(wasOpen?'open':'')+'><summary>노드 내용 · 이어진 생각</summary><div class="wm-chat-focus-content" data-focus-node="'+n.id+'">'+esc(nodeDisplayContent(n))+(parent?'\n\n부모 생각: '+esc(parent.title):'')+'\n\n처음 생각: '+esc(state.purpose)+'</div></details>';
  }
  function updateChatContext(){
    const n=getNode(chatNodeId);if(!n||!ui('chat-panel').innerHTML)return;

    ui('chat-eyebrow').textContent=(n.role==='main'?'메인 노드 · 문단 '+(state.mainOrder.indexOf(n.id)+1):'서브 노드')+' · '+(n.origin==='ai'?'제안':'내 생각');
    renderChatFocus();renderChatNodePicker();
  }
  function renderChat(){
    const n=getNode(chatNodeId);if(!n)return;
    ui('chat-panel').innerHTML='<div class="wm-chat-panel"><div class="wm-chat-heading"><div><div class="wm-chat-node-switcher" data-ui="chat-node-switcher"><label for="wm-chat-node-select">대화 노드 변경</label><select class="wm-chat-node-select" id="wm-chat-node-select" data-ui="chat-node-select" aria-label="대화할 노드 선택"></select></div><p class="wm-small" data-ui="chat-eyebrow"></p><h3 id="wm-chat-title" data-ui="chat-title"></h3></div><button type="button" class="wm-close" data-action="close-chat" aria-label="대화 닫기">×</button></div><div class="wm-chat-focus" data-ui="chat-focus" aria-label="현재 대화 중인 노드의 내용과 맥락"></div><div class="wm-tabs" role="tablist" aria-label="현재 노드의 대화와 검토"><button type="button" class="wm-tab" id="wm-chat-tab" role="tab" aria-selected="'+(chatTab==='chat')+'" aria-controls="wm-chat-pane" data-action="tab" data-tab="chat">대화 <span class="wm-small" data-ui="chat-count">'+n.messages.filter(m=>m.role==='user').length+'</span></button><button type="button" class="wm-tab" id="wm-eval-tab" data-ui="chat-review-tab" role="tab" aria-selected="'+(chatTab==='evaluation')+'" aria-controls="wm-eval-pane" data-action="tab" data-tab="evaluation">검토</button></div><div class="wm-chat-view" id="wm-chat-pane" role="tabpanel" aria-labelledby="wm-chat-tab" '+(chatTab!=='chat'?'hidden':'')+'><div class="wm-messages" data-ui="messages" role="log" aria-label="현재 노드의 대화 기록" aria-live="polite" aria-relevant="additions text"></div><div class="wm-quick"><button type="button" data-action="quick" data-text="이 아이디어를 검토해줘.">검토해 줘</button><button type="button" data-action="quick" data-text="새로운 아이디어를 제안하고 장점과 한계를 알려줘.">다른 아이디어는?</button><button type="button" data-action="quick" data-text="어떤 근거와 반론을 검토해야 할까?">근거·반론 살펴보기</button></div><form class="wm-compose" data-ui="chat-form"><div class="wm-compose-box"><textarea data-ui="chat-input" aria-label="현재 노드에 대한 메시지" maxlength="2000" placeholder="이 생각에 대해 이야기해 보세요."></textarea><button type="submit" class="wm-btn wm-primary">전송</button></div><p class="wm-compose-note">Enter 전송 · Shift+Enter 줄바꿈</p></form></div><div class="wm-tab-content" id="wm-eval-pane" role="tabpanel" aria-labelledby="wm-eval-tab" '+(chatTab!=='evaluation'?'hidden':'')+'></div></div>';
    ui('chat-input').value=drafts[n.id]||'';updateChatContext();renderMessages();renderChatPane();
  }

  function greeting(n){return n.role==='main'?'이 문단에서 무엇을 설명하고 싶나요? 떠오른 생각이나 더 살펴보고 싶은 부분을 적어주세요.':'“'+n.title+'”에 대해 어떤 생각이 드나요? 더 구체화하거나 다른 가능성을 살펴볼 수 있어요.';}
  function renderMessages(){const n=getNode(chatNodeId),host=ui('messages');if(!n||!host)return;const first='<div class="wm-message"><div class="wm-message-label">도우미</div><div class="wm-message-text">'+esc(greeting(n))+'</div></div>';host.innerHTML=first+n.messages.map((m,i)=>'<div class="wm-message '+(m.role==='user'?'wm-user':'')+'"><div class="wm-message-label">'+(m.role==='user'?'나':'도우미')+'</div><div class="wm-message-text">'+esc(m.role==='user'?m.text:displayReply(m.text))+'</div>'+(m.role==='user'?'<button type="button" class="wm-save-message" data-action="save-message" data-index="'+i+'">'+(m.savedNodeId?'지도에 남김 · 열기':'내 생각을 노드로 남기기')+'</button>':'')+(m.idea?'<div class="wm-add-idea"><span class="wm-tag">새로운 생각</span><p style="margin-top:7px">'+esc(m.idea.title)+'</p><button type="button" class="wm-btn" data-action="save-idea" data-index="'+i+'">'+(m.savedNodeId?'지도에 남김 · 열기':'이 생각을 노드로 추가')+'</button></div>':'')+'</div>').join('');host.scrollTop=host.scrollHeight;ui('chat-count').textContent=n.messages.filter(m=>m.role==='user').length;}
  function send(text){const n=getNode(chatNodeId);if(!n)return;text=text.trim();if(!text){toast('생각이나 질문을 입력해 주세요.');return;}n.messages.push({role:'user',text});const response=engine.reply(n,ancestors(n),state.purpose,text);n.messages.push({role:'assistant',text:response.text,...(response.idea?{idea:response.idea}:{})});n.evaluation=null;drafts[n.id]='';state.activity.chatted=true;if(ui('chat-input'))ui('chat-input').value='';if(/평가|검토/.test(text)){ensureEvaluation(n);state.activity.evaluated=true;}renderMessages();if(chatTab==='evaluation')renderChatPane();renderGuide();save();}
  function saveMessage(index,ideaMode){const parent=getNode(chatNodeId);if(!parent)return;const m=parent.messages[index];if(!m)return;if(m.savedNodeId){openChat(m.savedNodeId);return;}const data=ideaMode?{...m.idea,origin:'ai'}:{title:nodeTitle(m.text),content:m.text,origin:'user'};const node=addNode({...data,type:'idea',facet:parent.facet,method:ideaMode?parent.method:null},parent.id);m.savedNodeId=node.id;state.activity.idea=true;render();renderMessages();toast('생각을 지도에 남겼어요. 대화와 원래 노드는 유지됩니다.');}

  function renderChatPane(){const n=getNode(chatNodeId);if(!n)return;root.querySelectorAll('.wm-tab[data-action="tab"]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===chatTab)));$('#wm-chat-pane').hidden=chatTab!=='chat';$('#wm-eval-pane').hidden=chatTab!=='evaluation';if(chatTab==='evaluation'){const ev=ensureEvaluation(n);state.activity.evaluated=true;$('#wm-eval-pane').innerHTML='<div class="wm-eval-heading"><span class="wm-tag">'+(n.type==='topic'?'주제의 탐색 가능성':n.type==='question'?'질문의 탐색 가능성':'아이디어의 논증 검토')+'</span><span class="wm-small">잠정 검토</span></div>'+ev.items.map(it=>'<div class="wm-eval-item"><h3>'+esc(it.label)+'</h3><p>'+esc(it.text)+'</p></div>').join('');renderGuide();save();}}

  function openOriginal(){openModal('original');ui('dialog').innerHTML=header('첫 메인 노드의 출발점','처음 입력한 생각')+'<div class="wm-tab-content"><div class="wm-callout" style="white-space:pre-wrap">'+esc(state.originalInput)+'</div><p class="wm-small">처음 입력한 원문입니다. 첫 메인 노드는 직접 수정할 수 있으며, 원문은 이곳에 남습니다.</p><div class="wm-eval-item"><h3>처음 생각·첫 문단 내용</h3><p>'+esc(state.purpose)+'</p></div></div><div class="wm-dialog-footer"><button type="button" class="wm-btn" data-action="edit" data-id="n1">첫 메인 노드 직접 수정</button><button type="button" class="wm-btn wm-primary" data-action="close">지도로 돌아가기</button></div>';focusModal();}
  function openEdit(id){const n=getNode(id);openModal('edit');ui('dialog').dataset.editId=id;ui('dialog').innerHTML=header('직접 수정 · 대화와 자식 노드는 유지','노드 내용 다듬기')+'<form class="wm-tab-content wm-form-stack" data-ui="edit-form"><label>제목<input class="wm-field" name="title" maxlength="100" required value="'+esc(n.title)+'"></label><label>내용<textarea class="wm-field" name="content" rows="7" maxlength="3000" required>'+esc(n.content)+'</textarea></label>'+(id==='n1'?'<label>입력 종류<select class="wm-field" name="kind"><option value="topic" '+(n.type==='topic'?'selected':'')+'>주제·질문</option><option value="claim" '+(n.type==='claim'?'selected':'')+'>잠정 주장</option></select></label>':'')+'<p class="wm-small">수정한 내용은 이후 질문·대화·검토에 반영됩니다. 이미 남긴 대화와 자식 노드는 그때의 기록으로 보존됩니다.</p><button type="submit" class="wm-btn wm-primary">수정 저장</button></form>';focusModal();}

  // Hold a main paragraph for 420 ms, then move it between paragraph slots.

  function activateMainDrag(session){

  function initializeMainDrag(){
